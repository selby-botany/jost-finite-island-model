name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Split into two named, separately timed/budgeted steps (R19) rather
      # than one opaque `./build --ci` step: the fast step re-runs the
      # same deterministic layer `--ci` also covers (`build`'s own
      # pyproject.toml-driven default marker filter, no coverage) purely
      # to fail fast -- a few extra seconds -- before paying for the
      # `slow`/`statistical` scenario suite's much larger wall-clock cost.
      # Each step's own duration is visible in the Actions run summary
      # without any extra instrumentation; each `timeout-minutes` is a
      # hard, non-flaky budget enforced by the runner itself rather than
      # a wall-clock assertion inside the test run, which machine-speed
      # variance would make a non-deterministic pass/fail signal.
      - name: Run the fast deterministic test layer (fail fast)
        run: ./build --no-lint --no-type --no-docs --no-package
        timeout-minutes: 5
      # `--ci` drops the default `-m` marker filter entirely (build's own
      # "authoritative --ci gate runs every marker" comment), so this step
      # is also where the `gui`-marked suite (design doc
      # `20260819-claude-sonnet-5-graphical-interface.md` §6.4) first runs
      # -- real Tk widgets, which need a display server this headless
      # ubuntu-latest runner does not have by default. The fast step above
      # never needs this: its bare `./build` invocation keeps
      # pyproject.toml's own default marker filter, which already excludes
      # `gui` alongside `statistical`/`slow`/`packaging`.
      - name: Install Xvfb for the gui-marked test suite
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the full CI gate (lint, type, docs, package, and the
          full test suite incl. slow/statistical/gui scenarios)
        run: xvfb-run --auto-servernum ./build --ci
        timeout-minutes: 30

  # Gate for the release jobs below: cheap and fast, so it runs alongside
  # `build` rather than waiting on it. Only ever runs for a tag push (every
  # other trigger skips it via the `if:`), and only ever raises the tag's
  # own shape and ancestry -- it does not touch source, so it does not
  # duplicate what `build` already checks.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Require an annotated tag that is an ancestor of main
        run: |
          # actions/checkout's own fetch of the triggering ref deliberately
          # force-overwrites the local refs/tags/<name> to point directly at
          # GITHUB_SHA (a guard against the remote tag moving between event
          # and checkout) -- that strips the annotation, so reading
          # refs/tags/${GITHUB_REF_NAME} here always looks lightweight,
          # regardless of what was actually pushed. Confirmed live: v1.1.0
          # is a genuine annotated tag on the remote (git cat-file -t
          # reports "tag"), yet this exact step failed with "v1.1.0 is a
          # lightweight tag" before this fix, because it was reading the
          # checkout-clobbered local ref instead of the real one. Re-fetch
          # the tag under a name checkout never touches to see its real,
          # unclobbered type.
          git fetch --no-tags --quiet origin \
              "+refs/tags/${GITHUB_REF_NAME}:refs/tags/verify-tag-check"
          if ! git rev-parse --verify --quiet "refs/tags/verify-tag-check^{tag}" >/dev/null; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; releases require an annotated tag (git tag -a)" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of main" >&2
            exit 1
          fi

  # windows and publish were formerly a separate release.yml, triggered
  # independently by the same tag push with no dependency on this file's
  # build job -- so a tag could publish a release before CI had even
  # started, let alone passed. Folding them in here and gating on
  # `needs: [build, verify-tag]` makes that structurally impossible: GitHub
  # Actions cannot start a job until every job it needs has succeeded.
  #
  # windows (x64) and windows-arm64 are two independent jobs, not one
  # matrix, because PyInstaller never cross-compiles: the executable it
  # produces always matches the CPU architecture of the interpreter that
  # ran it. Getting a native ARM64 executable means actually running the
  # build on an ARM64 Windows runner, not passing a different flag on the
  # same runner.
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - shell: pwsh
        run: |
          $expectedVersion = "fim $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $actualVersion = .\dist\fim.exe --version
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version '$actualVersion' is not '$expectedVersion'"
          }
          .\dist\fim.exe --help
          .\dist\fim.exe init --output tiny.yaml
          (Get-Content tiny.yaml) `
            -replace 'N: 450', 'N: 20' `
            -replace 'd: 20', 'd: 2' `
            -replace 'convergence_window: 50', 'convergence_window: 4' `
            -replace 'convergence_tolerance: 0.01', 'convergence_tolerance: 1.0' `
            -replace 'max_generations: 10000', 'max_generations: 10' `
            | Set-Content tiny.yaml
          .\dist\fim.exe run tiny.yaml --output smoke --quiet
          $expectedArtifacts = @(
            "manifest.json",
            "report.json",
            "scatter.png",
            "trajectory.jsonl"
          )
          $actualArtifacts = @(
            Get-ChildItem .\smoke -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          if (Compare-Object $expectedArtifacts $actualArtifacts) {
            throw "Executable smoke run did not produce exactly four artifacts"
          }
          foreach ($artifact in $expectedArtifacts) {
            if ((Get-Item ".\smoke\$artifact").Length -eq 0) {
              throw "Executable smoke artifact '$artifact' is empty"
            }
          }
          # A startup smoke check, not a functional GUI test (design doc
          # 20260819-claude-sonnet-5-graphical-interface.md §5.3; §6.4/§6.5
          # explain why that split is deliberate): no widget is driven
          # here, only that the zero-argument launch stays alive for a few
          # seconds instead of crashing immediately, proving the GUI path
          # starts at all.
          $guiProcess = Start-Process -FilePath .\dist\fim.exe -PassThru
          Start-Sleep -Seconds 5
          if ($guiProcess.HasExited) {
            throw "GUI process exited early (exit code $($guiProcess.ExitCode)) instead of staying open"
          }
          Stop-Process -Id $guiProcess.Id -Force
          Rename-Item .\dist\fim.exe fim-windows-x64.exe
          $hash = (Get-FileHash .\dist\fim-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  fim-windows-x64.exe" | Set-Content .\dist\fim-windows-x64.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows
          # Handoff to `publish` within this same workflow run only; the
          # executable's durable home is the GitHub Release `publish`
          # creates from it, not this transient inter-job artifact.
          retention-days: 1
          path: |
            dist/fim-windows-x64.exe
            dist/fim-windows-x64.exe.sha256

  # `windows-arm64` mirrors `windows` step for step; keep the two in sync by
  # hand if either changes -- both are exercised on every tagged release, so
  # a drift between them shows up as a failure here rather than staying
  # latent. `windows-11-arm` is a GitHub-hosted ARM64 Windows runner;
  # `actions/setup-python`'s `architecture: arm64` selects the matching
  # native CPython build rather than an x64 build running under emulation.
  windows-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - shell: pwsh
        run: |
          $expectedVersion = "fim $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $actualVersion = .\dist\fim.exe --version
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version '$actualVersion' is not '$expectedVersion'"
          }
          .\dist\fim.exe --help
          .\dist\fim.exe init --output tiny.yaml
          (Get-Content tiny.yaml) `
            -replace 'N: 450', 'N: 20' `
            -replace 'd: 20', 'd: 2' `
            -replace 'convergence_window: 50', 'convergence_window: 4' `
            -replace 'convergence_tolerance: 0.01', 'convergence_tolerance: 1.0' `
            -replace 'max_generations: 10000', 'max_generations: 10' `
            | Set-Content tiny.yaml
          .\dist\fim.exe run tiny.yaml --output smoke --quiet
          $expectedArtifacts = @(
            "manifest.json",
            "report.json",
            "scatter.png",
            "trajectory.jsonl"
          )
          $actualArtifacts = @(
            Get-ChildItem .\smoke -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          if (Compare-Object $expectedArtifacts $actualArtifacts) {
            throw "Executable smoke run did not produce exactly four artifacts"
          }
          foreach ($artifact in $expectedArtifacts) {
            if ((Get-Item ".\smoke\$artifact").Length -eq 0) {
              throw "Executable smoke artifact '$artifact' is empty"
            }
          }
          # A startup smoke check, not a functional GUI test (design doc
          # 20260819-claude-sonnet-5-graphical-interface.md §5.3; §6.4/§6.5
          # explain why that split is deliberate): no widget is driven
          # here, only that the zero-argument launch stays alive for a few
          # seconds instead of crashing immediately, proving the GUI path
          # starts at all.
          $guiProcess = Start-Process -FilePath .\dist\fim.exe -PassThru
          Start-Sleep -Seconds 5
          if ($guiProcess.HasExited) {
            throw "GUI process exited early (exit code $($guiProcess.ExitCode)) instead of staying open"
          }
          Stop-Process -Id $guiProcess.Id -Force
          Rename-Item .\dist\fim.exe fim-windows-arm64.exe
          $hash = (Get-FileHash .\dist\fim-windows-arm64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  fim-windows-arm64.exe" | Set-Content .\dist\fim-windows-arm64.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-arm64
          # Handoff to `publish` within this same workflow run only; the
          # executable's durable home is the GitHub Release `publish`
          # creates from it, not this transient inter-job artifact.
          retention-days: 1
          path: |
            dist/fim-windows-arm64.exe
            dist/fim-windows-arm64.exe.sha256

  # Validates install/homebrew/Formula/fim.rb end to end, not just its
  # style/metadata -- design doc
  # 20260821-claude-sonnet-5-macos-linux-packaging.md §3.1/§3.4. Not
  # tag-gated like the release jobs below: this catches a formula
  # regression (e.g. a missing entry point, a broken venv/pip install
  # under Homebrew's own python@3.12) on every push, the same way
  # `build` does for the Python package itself, rather than only at
  # release time.
  homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: bash install/homebrew/test-formula

  # macos-arm64 (Apple Silicon) and macos-x64 (Intel) are two independent
  # jobs, not one matrix, for the same reason windows/windows-arm64 are:
  # PyInstaller never cross-compiles, so a native executable requires
  # actually running the build on a matching runner. `macos-13` (Intel)
  # was fully retired by GitHub in December 2025; `macos-15-intel` is the
  # current Intel label, confirmed against GitHub's own runner-images
  # changelog (design doc
  # 20260821-claude-sonnet-5-macos-linux-packaging.md §2) rather than
  # assumed from older knowledge. Unlike Windows, macOS builds a real
  # `.app` (packaging/fim.spec's `sys.platform == "darwin"` branch, onedir
  # plus `BUNDLE`) so Finder can double-click-launch it, then wraps that
  # in a `.dmg` for the drag-to-Applications install pattern macOS users
  # actually expect -- a bare `.app` zip has no equivalent of that.
  macos-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the .app and wrap it in a .dmg
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim.app/Contents/MacOS/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim.app/Contents/MacOS/fim --help >/dev/null
          dist/fim.app/Contents/MacOS/fim init --output tiny.yaml
          sed -i '' \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim.app/Contents/MacOS/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          # A startup smoke check, not a functional GUI test (matches
          # the Windows job's own equivalent): proves the zero-argument
          # Finder-launch path starts and stays alive instead of
          # crashing immediately -- no widget is driven.
          open dist/fim.app
          sleep 5
          gui_pid="$(pgrep -f 'dist/fim.app/Contents/MacOS/fim' | head -1)"
          if [[ -z "${gui_pid}" ]] || ! kill -0 "${gui_pid}" 2>/dev/null; then
            echo "::error::GUI process exited early instead of staying open"
            exit 1
          fi
          kill "${gui_pid}"
          mkdir .dmg-staging
          cp -R dist/fim.app .dmg-staging/
          ln -s /Applications .dmg-staging/Applications
          hdiutil create -volname "fim" -srcfolder .dmg-staging \
              -ov -format UDZO fim-macos-arm64.dmg
          shasum -a 256 fim-macos-arm64.dmg > fim-macos-arm64.dmg.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-arm64
          retention-days: 1
          path: |
            fim-macos-arm64.dmg
            fim-macos-arm64.dmg.sha256

  # macos-x64 mirrors macos-arm64 step for step; keep the two in sync by
  # hand if either changes, the same tradeoff windows-arm64 already
  # accepts for mirroring windows.
  macos-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the .app and wrap it in a .dmg
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim.app/Contents/MacOS/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim.app/Contents/MacOS/fim --help >/dev/null
          dist/fim.app/Contents/MacOS/fim init --output tiny.yaml
          sed -i '' \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim.app/Contents/MacOS/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          open dist/fim.app
          sleep 5
          gui_pid="$(pgrep -f 'dist/fim.app/Contents/MacOS/fim' | head -1)"
          if [[ -z "${gui_pid}" ]] || ! kill -0 "${gui_pid}" 2>/dev/null; then
            echo "::error::GUI process exited early instead of staying open"
            exit 1
          fi
          kill "${gui_pid}"
          mkdir .dmg-staging
          cp -R dist/fim.app .dmg-staging/
          ln -s /Applications .dmg-staging/Applications
          hdiutil create -volname "fim" -srcfolder .dmg-staging \
              -ov -format UDZO fim-macos-x64.dmg
          shasum -a 256 fim-macos-x64.dmg > fim-macos-x64.dmg.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-x64
          retention-days: 1
          path: |
            fim-macos-x64.dmg
            fim-macos-x64.dmg.sha256

  # The single Linux release artifact install.sh downloads (design doc
  # §3.5). Built inside `python:3.12-slim-bullseye`, not a bare
  # `ubuntu-latest` runner and not a `manylinux`-family image: a bare
  # runner links against whatever glibc that runner happens to ship,
  # which can be newer than a user's own system and fail with
  # `GLIBC_2.XX not found`; manylinux's own bundled Pythons are built
  # without `--enable-shared`, which PyInstaller requires ("Python was
  # built without a shared library") -- confirmed by a real local build
  # attempt against `manylinux_2_28_x86_64` before switching to this
  # image. Debian 11 (bullseye)'s glibc 2.31 gives the same
  # older-baseline portability goal manylinux was chosen for, with a
  # Python build PyInstaller can actually use.
  linux-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # PyInstaller requires `objdump` on Linux to analyze shared
      # libraries; the slim image does not include it. Confirmed by a
      # real local build failing with "On Linux, objdump is required"
      # before this step was added.
      - run: apt-get update -qq && apt-get install -qq -y --no-install-recommends binutils
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the executable
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim --help >/dev/null
          dist/fim init --output tiny.yaml
          sed -i \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          # No GUI-launch smoke check here: this container has no
          # display server, and the GUI path is not this artifact's own
          # concern -- `fim-linux-x64` is what install.sh downloads and
          # dispatches through `fim.launcher` exactly like the other two
          # platforms' single executables already do.
          mv dist/fim fim-linux-x64
          sha256sum fim-linux-x64 > fim-linux-x64.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-x64
          retention-days: 1
          path: |
            fim-linux-x64
            fim-linux-x64.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-arm64, macos-arm64, macos-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.*
      - name: Verify tag format and version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME#v}" = "$(cat version.txt)"
      - run: python -m build
      - name: Extract changelog release notes
        run: dev/bin/extract-release-notes "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: windows-arm64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: macos-arm64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: macos-x64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: linux-x64
          path: dist
      # Every executable/archive and its .sha256 sidecar crossed a job
      # boundary (upload from windows/windows-arm64/macos-arm64/
      # macos-x64/linux-x64, download here); verify each sidecar still
      # matches the file that actually arrived, rather than re-shipping
      # any of them unread and trusting the hand-off blindly.
      - name: Verify the downloaded executables against their own checksums
        run: |
          cd dist
          sha256sum -c fim-windows-x64.exe.sha256
          sha256sum -c fim-windows-arm64.exe.sha256
          sha256sum -c fim-macos-arm64.dmg.sha256
          sha256sum -c fim-macos-x64.dmg.sha256
          sha256sum -c fim-linux-x64.sha256
      # One consolidated manifest covering every artifact this release
      # actually publishes (wheel, sdist, both Windows executables, both
      # macOS .dmg images, and the Linux binary), alongside each
      # artifact's own pre-existing `.sha256` sidecar (README's
      # documented per-file verification step, left in place for that
      # specific workflow).
      - name: Generate a checksum manifest for every released artifact
        run: |
          cd dist
          sha256sum \
            fim-windows-x64.exe fim-windows-arm64.exe \
            fim-macos-arm64.dmg fim-macos-x64.dmg \
            fim-linux-x64 \
            ./*.whl ./*.tar.gz \
            > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --notes-file release-notes.md
