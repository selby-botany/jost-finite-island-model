name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  # Drives the `slow-tests` job alone (see its own `if:` below) --
  # every other job in this file only ever runs for `push`/`pull_
  # request`/a tag push, never for these two triggers, so a scheduled
  # or manually dispatched run costs nothing beyond that one job.
  schedule:
    - cron: "17 8 * * *"  # ~03:17 US/Eastern (04:17 EDT), arbitrary
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # `schedule`/`workflow_dispatch` drive `slow-tests` alone (see its
    # own comment) -- this job stays exactly as fast and exactly as
    # blocking as before for the events it already ran for.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # pywebview's GTK backend (webview/platforms/gtk.py) imports `gi`
      # (PyGObject) and needs GTK3/WebKit2 4.1/Soup 3.0 GObject
      # Introspection typelibs -- none of which the bare `pywebview`
      # package pulls in on its own (pyproject.toml's own `[gtk]`-extra
      # split). `libgirepository1.0-dev`/`libcairo2-dev`/`pkg-config` are
      # PyGObject's own build-time requirements, needed before `pip
      # install` below, not just at runtime -- confirmed by a real,
      # isolated-venv install on this exact `ubuntu-latest` image family
      # (Ubuntu 24.04) before this step was added. `xvfb` provides the
      # virtual display this job's own `gui`-marked pytest step (below)
      # needs; installed explicitly rather than assumed pre-provisioned
      # on the runner image.
      - name: Install pywebview's Linux GTK/WebKit runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
              xvfb gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-soup-3.0 \
              libwebkit2gtk-4.1-0 libgirepository1.0-dev libcairo2-dev \
              pkg-config
      # `jit` (numba) alongside `dev`: this is the one job that gates
      # `--cov-fail-under=90`, and `fim.model.vectorized`'s own
      # JIT-batched helpers (`drift_vectorized`/`mutate_vectorized`/
      # `step_vectorized`/`VectorizedAdvancer`) import `numba`
      # unconditionally whenever Backend V runs at all -- with `numba`
      # absent, `pytest.importorskip("numba")` skips all of it cleanly
      # (no crash, see `24e905e`), but that leaves a large, genuinely
      # untested slice of `vectorized.py` (down to 50% line coverage
      # measured directly, `20260901-claude-sonnet-5-fim-engine-backend-
      # factory-design.md` §10 Stage F9) counted as "missing" by the
      # coverage gate below -- not a coverage-accounting quirk, real
      # code this job was never actually exercising. `numba`'s own
      # optional-extra status for actual installs is untouched by this
      # (no other job here installs `.[jit]` either, and none needs to:
      # `pip install fim` without it, and every `jit="numba"`/
      # `engine_backend="generational-vector"` code path staying purely
      # opt-in, are both properties of the package's own dependency
      # graph, not of what this one CI job happens to have installed).
      - run: python -m pip install -e ".[dev,jit]"
      # Split into two named, separately timed/budgeted steps rather
      # than one opaque `./build --ci` step: the fast step re-runs the
      # same deterministic layer `--ci` also covers (`build`'s own
      # pyproject.toml-driven default marker filter, no coverage) purely
      # to fail fast -- a few extra seconds -- before paying for the
      # `slow`/`statistical` scenario suite's much larger wall-clock cost.
      # Each step's own duration is visible in the Actions run summary
      # without any extra instrumentation; each `timeout-minutes` is a
      # hard, non-flaky budget enforced by the runner itself rather than
      # a wall-clock assertion inside the test run, which machine-speed
      # variance would make a non-deterministic pass/fail signal.
      - name: Run the fast deterministic test layer (fail fast)
        run: ./build --no-lint --no-type --no-docs --no-package
        timeout-minutes: 5
      # `build`'s own `--ci` branch deliberately drops `-m`'s argument
      # down to just `not slow` (see `build`'s own comment at that line)
      # rather than negating every OTHER marker in turn, specifically so
      # a newly added marker (besides `slow` itself) is included here by
      # default instead of silently excluded -- `gui` is exactly such a
      # marker, so this step really does try to open a real pywebview/
      # GTK window, unlike the fast layer above (a bare, unflagged
      # `pytest` call, which still gets pyproject.toml's own default
      # `-m 'not ... and not gui'`). Found the hard way: without
      # `xvfb-run`, this step crashed instantly the moment pytest reached
      # the first `gui`-marked test file, before printing a single result
      # from it -- no display at all, not a slow hang, `##[error]Process
      # completed with exit code 1` arriving 1.2ms after that file's own
      # collection line.
      #
      # Budget history, for whoever next has to touch this number: 30
      # minutes was sufficient through the last known green run of this
      # step (2dd1ea3, 2026-08-29, full step 10m54s total, before this
      # file's own `slow`-marked engine scenarios existed at all). Once
      # they did, this step's own timeout was raised twice in one day
      # (30 -> 45 -> 75 minutes) chasing what looked like ordinary
      # CI-runner speed variance on top of a legitimately expensive
      # suite -- and STILL timed out a third time (run 33330448601,
      # commit 6db08c0, 75-minute budget), stalled at the identical
      # point as every prior failure (immediately after `test/
      # validation/test_simulator_equilibrium.py`'s own fast items print
      # their progress dots) for over 71 minutes straight with zero
      # further pytest output, on a push that touched no test-affecting
      # code at all. Three raises that each proved insufficient within
      # the same day is not "the estimate was a little off" -- it is the
      # wrong fix for this shape of problem: a single `slow`+
      # `statistical`-marked test (`test_crow_aoki_torus_scenario_via_
      # engine`, 150 loci at horizon 6000, no equilibrium-start shortcut
      # available -- ~23 minutes measured locally, offline, on ordinary
      # developer hardware) run inside a job that also has to fit lint,
      # type-checking, docs, packaging, and every `gui` test into the
      # same fixed wall-clock window, on a shared runner whose own CPU
      # allocation for a long, sustained, CPU-bound pure-Python
      # simulation loop is not something a fixed timeout can be sized
      # against reliably.
      #
      # Fix: `slow`-marked tests no longer run here at all -- moved to
      # the separately scheduled/on-demand `slow-tests` job below, which
      # answers exactly the question `doc/fim-simulator-detailed-test-
      # plan.md` (§3) already documented as this marker's own intended
      # home ("CI nightly / on demand") well before this job's own
      # budget problems started. This step's own timeout drops back down
      # accordingly -- the `slow` suite was the entire reason it needed
      # to be large.
      - name: Run the full CI gate (lint, type, docs, package, and the
          full test suite incl. statistical/gui scenarios, excl. slow)
        run: xvfb-run --auto-servernum ./build --ci
        timeout-minutes: 20

  # The `slow`-marked engine scenario suite (`test/validation/test_
  # simulator_equilibrium.py`'s five published/theoretical literature
  # comparisons, `test_crow_aoki_torus_scenario_via_engine` alone
  # ~23 minutes measured locally) -- split out of `build`'s own per-push
  # gate above after that gate's own `timeout-minutes` proved unable to
  # reliably budget for it even after being raised three times in one day
  # (30 -> 45 -> 75 minutes, the last of which still timed out; see
  # `build`'s own step comment for the full evidence). Runs on a daily
  # schedule and on manual dispatch only -- never for a push or a pull
  # request, so a slow runner or a newly added expensive scenario can
  # never block or delay an ordinary push the way it did three times
  # before this job existed. This is exactly what this project's own
  # `doc/fim-simulator-detailed-test-plan.md` (§3) already documented as
  # the `slow` marker's intended home ("CI nightly / on demand") before
  # any of those three failures happened -- the code did not match that
  # documented intent until now.
  #
  # A single Python version (not `build`'s own 3.12/3.13 matrix): the
  # `slow` suite exercises the engine's own scientific behavior, which
  # does not vary by interpreter version the way a packaging or typing
  # concern might -- `build`'s own matrix already covers the interpreter-
  # version question for everything else.
  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run the slow engine-scenario suite
        run: ./build --slow-only

  # Gate for the release jobs below: cheap and fast, so it runs alongside
  # `build` rather than waiting on it. Only ever runs for a tag push (every
  # other trigger skips it via the `if:`), and only ever raises the tag's
  # own shape and ancestry -- it does not touch source, so it does not
  # duplicate what `build` already checks.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Require an annotated tag that is an ancestor of main
        run: |
          # actions/checkout's own fetch of the triggering ref deliberately
          # force-overwrites the local refs/tags/<name> to point directly at
          # GITHUB_SHA (a guard against the remote tag moving between event
          # and checkout) -- that strips the annotation, so reading
          # refs/tags/${GITHUB_REF_NAME} here always looks lightweight,
          # regardless of what was actually pushed. Confirmed live: v1.1.0
          # is a genuine annotated tag on the remote (git cat-file -t
          # reports "tag"), yet this exact step failed with "v1.1.0 is a
          # lightweight tag" before this fix, because it was reading the
          # checkout-clobbered local ref instead of the real one. Re-fetch
          # the tag under a name checkout never touches to see its real,
          # unclobbered type.
          git fetch --no-tags --quiet origin \
              "+refs/tags/${GITHUB_REF_NAME}:refs/tags/verify-tag-check"
          if ! git rev-parse --verify --quiet "refs/tags/verify-tag-check^{tag}" >/dev/null; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; releases require an annotated tag (git tag -a)" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of main" >&2
            exit 1
          fi

  # windows and publish were formerly a separate release.yml, triggered
  # independently by the same tag push with no dependency on this file's
  # build job -- so a tag could publish a release before CI had even
  # started, let alone passed. Folding them in here and gating on
  # `needs: [build, verify-tag]` makes that structurally impossible: GitHub
  # Actions cannot start a job until every job it needs has succeeded.
  #
  # windows (x64) and windows-arm64 are two independent jobs, not one
  # matrix, because PyInstaller never cross-compiles: the executable it
  # produces always matches the CPU architecture of the interpreter that
  # ran it. Getting a native ARM64 executable means actually running the
  # build on an ARM64 Windows runner, not passing a different flag on the
  # same runner.
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - shell: pwsh
        run: |
          $expectedVersion = "fim $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $actualVersion = .\dist\fim.exe --version
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version '$actualVersion' is not '$expectedVersion'"
          }
          .\dist\fim.exe --help
          .\dist\fim.exe init --output tiny.yaml
          (Get-Content tiny.yaml) `
            -replace 'N: 450', 'N: 20' `
            -replace 'd: 20', 'd: 2' `
            -replace 'convergence_window: 50', 'convergence_window: 4' `
            -replace 'convergence_tolerance: 0.01', 'convergence_tolerance: 1.0' `
            -replace 'max_generations: 10000', 'max_generations: 10' `
            | Set-Content tiny.yaml
          .\dist\fim.exe run tiny.yaml --output smoke --quiet
          $expectedArtifacts = @(
            "manifest.json",
            "report.json",
            "scatter.png",
            "trajectory.jsonl"
          )
          $actualArtifacts = @(
            Get-ChildItem .\smoke -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          if (Compare-Object $expectedArtifacts $actualArtifacts) {
            throw "Executable smoke run did not produce exactly four artifacts"
          }
          foreach ($artifact in $expectedArtifacts) {
            if ((Get-Item ".\smoke\$artifact").Length -eq 0) {
              throw "Executable smoke artifact '$artifact' is empty"
            }
          }
          # A startup smoke check, not a functional GUI test: no
          # widget is driven here, only that the zero-argument launch
          # stays alive for a few seconds instead of crashing
          # immediately, proving WebView2 starts at all on this runner
          # image.
          $guiProcess = Start-Process -FilePath .\dist\fim.exe -PassThru
          Start-Sleep -Seconds 5
          if ($guiProcess.HasExited) {
            throw "GUI process exited early (exit code $($guiProcess.ExitCode)) instead of staying open"
          }
          Stop-Process -Id $guiProcess.Id -Force
          Rename-Item .\dist\fim.exe fim-windows-x64.exe
          $hash = (Get-FileHash .\dist\fim-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  fim-windows-x64.exe" | Set-Content .\dist\fim-windows-x64.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows
          # Handoff to `publish` within this same workflow run only; the
          # executable's durable home is the GitHub Release `publish`
          # creates from it, not this transient inter-job artifact.
          retention-days: 1
          path: |
            dist/fim-windows-x64.exe
            dist/fim-windows-x64.exe.sha256

  # `windows-arm64` mirrors `windows` step for step; keep the two in sync by
  # hand if either changes -- both are exercised on every tagged release, so
  # a drift between them shows up as a failure here rather than staying
  # latent. `windows-11-arm` is a GitHub-hosted ARM64 Windows runner;
  # `actions/setup-python`'s `architecture: arm64` selects the matching
  # native CPython build rather than an x64 build running under emulation.
  windows-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - shell: pwsh
        run: |
          $expectedVersion = "fim $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $actualVersion = .\dist\fim.exe --version
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version '$actualVersion' is not '$expectedVersion'"
          }
          .\dist\fim.exe --help
          .\dist\fim.exe init --output tiny.yaml
          (Get-Content tiny.yaml) `
            -replace 'N: 450', 'N: 20' `
            -replace 'd: 20', 'd: 2' `
            -replace 'convergence_window: 50', 'convergence_window: 4' `
            -replace 'convergence_tolerance: 0.01', 'convergence_tolerance: 1.0' `
            -replace 'max_generations: 10000', 'max_generations: 10' `
            | Set-Content tiny.yaml
          .\dist\fim.exe run tiny.yaml --output smoke --quiet
          $expectedArtifacts = @(
            "manifest.json",
            "report.json",
            "scatter.png",
            "trajectory.jsonl"
          )
          $actualArtifacts = @(
            Get-ChildItem .\smoke -File |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          if (Compare-Object $expectedArtifacts $actualArtifacts) {
            throw "Executable smoke run did not produce exactly four artifacts"
          }
          foreach ($artifact in $expectedArtifacts) {
            if ((Get-Item ".\smoke\$artifact").Length -eq 0) {
              throw "Executable smoke artifact '$artifact' is empty"
            }
          }
          # See `windows`'s own identical step for what this checks and why.
          $guiProcess = Start-Process -FilePath .\dist\fim.exe -PassThru
          Start-Sleep -Seconds 5
          if ($guiProcess.HasExited) {
            throw "GUI process exited early (exit code $($guiProcess.ExitCode)) instead of staying open"
          }
          Stop-Process -Id $guiProcess.Id -Force
          Rename-Item .\dist\fim.exe fim-windows-arm64.exe
          $hash = (Get-FileHash .\dist\fim-windows-arm64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  fim-windows-arm64.exe" | Set-Content .\dist\fim-windows-arm64.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-arm64
          # Handoff to `publish` within this same workflow run only; the
          # executable's durable home is the GitHub Release `publish`
          # creates from it, not this transient inter-job artifact.
          retention-days: 1
          path: |
            dist/fim-windows-arm64.exe
            dist/fim-windows-arm64.exe.sha256

  # Validates install/homebrew/Formula/fim.rb on every push, independent
  # of a tag: a `head`-only formula (no stable download yet) can still
  # drift out of sync with pyproject.toml's own dependencies at any
  # time, not only at release time.
  homebrew:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: bash install/homebrew/test-formula

  # macos-arm64 (Apple Silicon) and macos-x64 (Intel) are two independent
  # jobs, not one matrix, for the same reason windows/windows-arm64 are:
  # PyInstaller never cross-compiles, so a native executable requires
  # actually running the build on a matching runner. `macos-13` (Intel)
  # was fully retired by GitHub in December 2025; `macos-15-intel` is the
  # current Intel label, confirmed against GitHub's own runner-images
  # changelog rather than assumed from older knowledge. Unlike Windows,
  # macOS builds a real
  # `.app` (packaging/fim.spec's `sys.platform == "darwin"` branch, onedir
  # plus `BUNDLE`) so Finder can double-click-launch it, then wraps that
  # in a `.dmg` for the drag-to-Applications install pattern macOS users
  # actually expect -- a bare `.app` zip has no equivalent of that.
  macos-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the .app and wrap it in a .dmg
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim.app/Contents/MacOS/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim.app/Contents/MacOS/fim --help >/dev/null
          dist/fim.app/Contents/MacOS/fim init --output tiny.yaml
          sed -i '' \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim.app/Contents/MacOS/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          # A startup smoke check, not a functional GUI test (matches
          # the Windows job's own equivalent): proves the zero-argument
          # Finder-launch path starts and stays alive instead of
          # crashing immediately -- no widget is driven.
          open dist/fim.app
          sleep 5
          gui_pid="$(pgrep -f 'dist/fim.app/Contents/MacOS/fim' | head -1)"
          if [[ -z "${gui_pid}" ]] || ! kill -0 "${gui_pid}" 2>/dev/null; then
            echo "::error::GUI process exited early instead of staying open"
            exit 1
          fi
          kill "${gui_pid}"
          mkdir .dmg-staging
          cp -R dist/fim.app .dmg-staging/
          ln -s /Applications .dmg-staging/Applications
          hdiutil create -volname "fim" -srcfolder .dmg-staging \
              -ov -format UDZO fim-macos-arm64.dmg
          shasum -a 256 fim-macos-arm64.dmg > fim-macos-arm64.dmg.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-arm64
          retention-days: 1
          path: |
            fim-macos-arm64.dmg
            fim-macos-arm64.dmg.sha256

  # macos-x64 mirrors macos-arm64 step for step; keep the two in sync by
  # hand if either changes, the same tradeoff windows-arm64 already
  # accepts for mirroring windows.
  macos-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the .app and wrap it in a .dmg
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim.app/Contents/MacOS/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim.app/Contents/MacOS/fim --help >/dev/null
          dist/fim.app/Contents/MacOS/fim init --output tiny.yaml
          sed -i '' \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim.app/Contents/MacOS/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          open dist/fim.app
          sleep 5
          gui_pid="$(pgrep -f 'dist/fim.app/Contents/MacOS/fim' | head -1)"
          if [[ -z "${gui_pid}" ]] || ! kill -0 "${gui_pid}" 2>/dev/null; then
            echo "::error::GUI process exited early instead of staying open"
            exit 1
          fi
          kill "${gui_pid}"
          mkdir .dmg-staging
          cp -R dist/fim.app .dmg-staging/
          ln -s /Applications .dmg-staging/Applications
          hdiutil create -volname "fim" -srcfolder .dmg-staging \
              -ov -format UDZO fim-macos-x64.dmg
          shasum -a 256 fim-macos-x64.dmg > fim-macos-x64.dmg.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-x64
          retention-days: 1
          path: |
            fim-macos-x64.dmg
            fim-macos-x64.dmg.sha256

  # The single Linux release artifact install.sh downloads. Built inside
  # `python:3.12-slim-bullseye`, not a bare `ubuntu-latest` runner and
  # not a `manylinux`-family image: a bare runner links against whatever
  # glibc that runner happens to ship, which can be newer than a user's
  # own system and fail with `GLIBC_2.XX not found`; manylinux's own
  # bundled Pythons are built without `--enable-shared`, which
  # PyInstaller requires ("Python was built without a shared library")
  # -- confirmed by a real local build attempt against
  # `manylinux_2_28_x86_64` before switching to this image. Debian 11
  # (bullseye)'s glibc 2.31 gives the same older-baseline portability
  # goal manylinux was chosen for, with a Python build PyInstaller can
  # actually use.
  linux-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-tag]
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # PyInstaller requires `objdump` on Linux to analyze shared
      # libraries, and this image ships neither it nor a compiler.
      # `gcc`/`pkg-config`/`libgirepository1.0-dev`/`libcairo2-dev` are
      # PyGObject's own build-time requirements (`pyproject.toml`'s
      # `pywebview[gtk]` extra, Linux-only) -- confirmed by a real local
      # build against this exact image failing with "Unknown
      # compiler(s)" before these were added. `libwebkit2gtk-4.0-37`/
      # `gir1.2-webkit2-4.0`/`gir1.2-soup-2.4` are bullseye's available
      # versions -- older than the `4.1`/`3.0` pair a newer distribution
      # offers, but `pywebview`'s own GTK backend already falls back to
      # exactly this pair when `4.1` is not found, so this is a real,
      # supported combination, not a compromise.
      - run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends \
              binutils gcc pkg-config \
              libgirepository1.0-dev libcairo2-dev \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.0 gir1.2-soup-2.4 \
              libwebkit2gtk-4.0-37 xvfb xauth procps
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pyinstaller --workpath .pyinstaller-build --noconfirm
          packaging/fim.spec
      - name: Smoke-test the executable
        # Explicit: inside a `container:`, GitHub Actions defaults `run:`
        # steps to plain `sh` (dash in this image), not bash, since the
        # image is not guaranteed to have bash on PATH -- `set -o
        # pipefail` is a bashism dash rejects outright ("Illegal option
        # -o pipefail").
        shell: bash
        run: |
          set -euo pipefail
          expected_version="fim ${GITHUB_REF_NAME#v}"
          actual_version="$(dist/fim --version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error::Executable version '${actual_version}' is not '${expected_version}'"
            exit 1
          fi
          dist/fim --help >/dev/null
          dist/fim init --output tiny.yaml
          sed -i \
            -e 's/N: 450/N: 20/' \
            -e 's/d: 20/d: 2/' \
            -e 's/convergence_window: 50/convergence_window: 4/' \
            -e 's/convergence_tolerance: 0.01/convergence_tolerance: 1.0/' \
            -e 's/max_generations: 10000/max_generations: 10/' \
            tiny.yaml
          dist/fim run tiny.yaml --output smoke --quiet
          for artifact in manifest.json report.json scatter.png trajectory.jsonl; do
            if [[ ! -s "smoke/${artifact}" ]]; then
              echo "::error::Executable smoke artifact '${artifact}' missing or empty"
              exit 1
            fi
          done
          # A startup smoke check under a virtual display, matching the
          # other five platforms' own "stays alive" proof -- confirmed
          # working end to end against a real local build before this
          # step was written (xvfb-run needs xauth too, or it fails
          # immediately with "xauth command not found").
          xvfb-run --auto-servernum dist/fim &
          gui_pid=$!
          sleep 5
          if ! kill -0 "${gui_pid}" 2>/dev/null; then
            echo "::error::GUI process exited early instead of staying open"
            exit 1
          fi
          kill "${gui_pid}"
          # §3.11's own named worst case, made a real assertion rather
          # than left as an open question: on a Linux machine with no
          # WebKitGTK at all, the zero-argument launch must fail loudly
          # (a clear, bounded, non-zero-exit failure) rather than hang or
          # silently degrade. Purges the runtime packages the build
          # step's own `pip install`/`pyinstaller` needed, not the
          # already-built executable -- the frozen binary under test is
          # the exact same one the CLI smoke check above already
          # verified is otherwise correct.
          apt-get remove -qq -y libwebkit2gtk-4.0-37 gir1.2-webkit2-4.0
          set +e
          timeout 10 dist/fim >gui-startup.log 2>&1
          gui_exit=$?
          set -e
          if [[ "${gui_exit}" -eq 0 || "${gui_exit}" -eq 124 ]]; then
            echo "::error::Missing-WebKitGTK launch did not fail loudly (exit ${gui_exit})"
            cat gui-startup.log
            exit 1
          fi
          if [[ ! -s gui-startup.log ]]; then
            echo "::error::Missing-WebKitGTK launch failed silently (no stderr output)"
            exit 1
          fi
          # No GUI-launch smoke check beyond this: `fim-linux-x64` is
          # what install.sh downloads and dispatches through
          # `fim.launcher` exactly like the other two single-executable
          # platforms already do.
          mv dist/fim fim-linux-x64
          sha256sum fim-linux-x64 > fim-linux-x64.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-x64
          retention-days: 1
          path: |
            fim-linux-x64
            fim-linux-x64.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-arm64, macos-arm64, macos-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.*
      - name: Verify tag format and version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME#v}" = "$(cat version.txt)"
      - run: python -m build
      - name: Extract changelog release notes
        run: dev/bin/extract-release-notes "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: windows-arm64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: macos-arm64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: macos-x64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: linux-x64
          path: dist
      # Every executable/archive and its .sha256 sidecar crossed a job
      # boundary (upload from windows/windows-arm64/macos-arm64/
      # macos-x64/linux-x64, download here); verify each sidecar still
      # matches the file that actually arrived, rather than re-shipping
      # any of them unread and trusting the hand-off blindly.
      - name: Verify the downloaded executables against their own checksums
        run: |
          cd dist
          sha256sum -c fim-windows-x64.exe.sha256
          sha256sum -c fim-windows-arm64.exe.sha256
          sha256sum -c fim-macos-arm64.dmg.sha256
          sha256sum -c fim-macos-x64.dmg.sha256
          sha256sum -c fim-linux-x64.sha256
      # One consolidated manifest covering every artifact this release
      # actually publishes (wheel, sdist, both Windows executables, both
      # macOS .dmg images, and the Linux binary), alongside each
      # artifact's own pre-existing `.sha256` sidecar (README's
      # documented per-file verification step, left in place for that
      # specific workflow).
      - name: Generate a checksum manifest for every released artifact
        run: |
          cd dist
          sha256sum \
            fim-windows-x64.exe fim-windows-arm64.exe \
            fim-macos-arm64.dmg fim-macos-x64.dmg \
            fim-linux-x64 \
            ./*.whl ./*.tar.gz \
            > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --notes-file release-notes.md
