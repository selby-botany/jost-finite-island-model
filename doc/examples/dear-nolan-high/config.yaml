name: Dear-Nolan high migration
description: >-
  One hundred well-connected islands run from two founder alleles all the
  way to equilibrium.
class: calibration-dear-nolan
_read_only: true  # marks the shipped copy read-only; delete it in your own copy
N: 2000
ploidy: haploid
d: 100
m: 0.01
mu: 0.001
seed: 992000
loci:
  - locus_id: 1
    length: 400
initial_allele_count: 2
engine_backend: auto
convergence_statistic:
  - D
  - G_ST
precision: 0.01
# Statistics only: each replicate's full trajectory would be about 1 GiB, so
# only the reports and a decimated statistic history are kept; the summary is
# unaffected and the pooled curve is drawn from the saved histories.
trajectory_retention: statistics
