name: Jost (2008) Part VI
description: >-
  The four-island parameter set that anchors the simulator's calibration.
class: calibration-jost
_read_only: true  # marks the shipped copy read-only; delete it in your own copy
N: 100
ploidy: haploid
d: 4
m: 0.01
mu: 0.005
seed: 20260825
loci:
  - locus_id: 1
    length: 200
initial_allele_count: 2
initial_concentration: 1.0
deme_weighting: size
engine_backend: lineal
convergence_statistic: D
precision: 0.01
max_generations: 10000   # a cap: the run reports the precision it reached by then
n_replicates: 1
