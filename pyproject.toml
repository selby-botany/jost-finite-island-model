[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fim"
dynamic = ["version"]
description = "Finite island model simulator with per-generation trajectories"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [
    { name = "Marie Selby Botanical Gardens" },
]
keywords = [
    "finite island model",
    "population genetics",
    "simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib==3.9.*",
    "numpy==2.1.*",
    "pyparsing==3.1.*",
    "PyYAML==6.0.*",
]

[project.optional-dependencies]
dev = [
    "build==1.2.*",
    "coverage[toml]==7.*",
    "hypothesis==6.*",
    "mypy==1.11.*",
    "pydoc-markdown==4.*",
    "pyinstaller==6.*",
    "pytest==8.*",
    "pytest-cov==5.*",
    "ruff==0.6.*",
    "types-PyYAML==6.0.*",
]

[project.scripts]
fim = "fim.cli:main"

[project.urls]
Documentation = "https://github.com/selby-botany/jost-finite-island-model#readme"
Issues = "https://github.com/selby-botany/jost-finite-island-model/issues"
Repository = "https://github.com/selby-botany/jost-finite-island-model"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE.md",
    "/README.md",
    "/src/fim",
    "/version.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fim"]

[tool.hatch.version]
source = "regex"
path = "version.txt"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
    # mypy 1.11 requires TypeAlias for strict checking of these aliases.
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
"src/fim/engine.py" = ["N803"]
"test/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "test"]
packages = ["fim"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-m 'not statistical and not slow and not packaging' --strict-config --strict-markers"
testpaths = ["test"]
markers = [
    "packaging: requires a built distribution",
    "slow: long-running simulation horizon",
    "statistical: deterministic, seeded statistical validation",
]

[tool.coverage.run]
branch = true
source = ["fim"]
omit = [
    "src/fim/viz/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
