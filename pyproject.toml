[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "fim"
dynamic = ["version"]
description = "Finite island model simulator with per-generation trajectories"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [
    { name = "Marie Selby Botanical Gardens" },
]
keywords = [
    "finite island model",
    "population genetics",
    "simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib==3.11.*",
    "numpy>=2.3,<2.6",
    "pyparsing>=3.1,<3.4",
    "PyYAML==6.0.*",
    # Linux needs the `[gtk]` extra specifically: `pywebview`'s GTK
    # backend (`webview/platforms/gtk.py`) imports `gi`
    # (`PyGObject`) and requires GTK3/WebKit2 4.1/Soup 3.0 GObject
    # Introspection typelibs, none of which the bare `pywebview`
    # package pulls in on its own — confirmed by a real, isolated-venv
    # install on Ubuntu 24.04 (matching `ubuntu-latest`) before this
    # split was added: `pip install pywebview==6.*` alone leaves
    # `import webview` succeeding but `import gi` failing outright, a
    # gap the CI job's own GTK system packages (`.github/workflows/
    # ci.yml`'s `build` job) cannot paper over by themselves. macOS
    # (`pyobjc`, a pure-Python wheel) and Windows (`pythonnet`) both
    # already work with the bare package, so only Linux needs the
    # extra — design doc `20260821-claude-sonnet-5-graphical-
    # interface.md` §3.11.
    "pywebview==6.*; sys_platform != 'linux'",
    "pywebview[gtk]==6.*; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Never a base dependency — a plain `pip install` (and the default
# packaged build) never pulls this in. Two different opt-in paths pull
# it in lazily, not one: `fim.model.operators`'s own JIT helpers import
# it only when a caller explicitly asks for `jit="numba"`
# (`fim.engine.build_engine_backend`, Backend L/G); `fim.model.
# vectorized`'s own JIT helpers import it *unconditionally* whenever
# Backend V (`engine_backend="generational-vector"`, or `"auto"`
# resolving to it) actually runs — Backend V's own JIT-batched
# multinomial decomposition is what makes it competitive with Backend L
# at all (`fim.model.vectorized`'s own module docstring), so unlike
# Backend L/G there is no non-JIT fallback to degrade to. Test coverage
# for both paths uses `pytest.importorskip("numba")` (`test/model/
# test_vectorized.py`, `test/engine/test_engine.py`) so the base `[dev]`
# CI configuration — deliberately `numba`-free — still exercises every
# non-Backend-V code path and skips only what genuinely cannot run
# without it, rather than failing outright (found live: `numba` absent
# from CI's own `[dev]` install broke every Backend-V-touching test the
# first time any of Backend V's own code was actually pushed, since it
# had only ever been tested locally, where `numba` happened to already
# be installed). Design doc `20260901-claude-sonnet-5-fim-engine-
# backend-factory-design.md` §5.3/§10 Stage F5: `numba` 0.67.0 confirmed
# to compile scalar `Generator.binomial`/`.random`/`.integers`/
# `.uniform` calls bit-identically under `nogil=True`, and to build/run
# correctly under this project's own pinned `pyinstaller==6.*` on macOS
# (66 MB bundled, one benign warning; Windows not yet verified).
jit = [
    "numba==0.67.*",
]
dev = [
    "build>=1.2,<1.6",
    "coverage[toml]==7.*",
    "hypothesis==6.*",
    # `dev/bin/generate-help-html`'s own Markdown renderer (design doc
    # `20260822-claude-sonnet-5-in-app-help-design.md` §4.1) -- a dev-only
    # dependency, never shipped in a packaged build: it renders
    # `doc/usage.md`/`doc/configuration.md` to committed HTML fragments
    # once at commit time, the same way `pydoc-markdown` below renders
    # `src/fim/API.md` and never ships either.
    "markdown-it-py==4.*",
    "mypy>=1.11,<2.4",
    "pydoc-markdown==4.*",
    "pyinstaller==6.*",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<0.17",
    "types-PyYAML==6.0.*",
]

[project.scripts]
fim = "fim.launcher:main"
fim-gui = "fim.gui.app:main"

[project.urls]
Documentation = "https://github.com/selby-botany/jost-finite-island-model#readme"
Issues = "https://github.com/selby-botany/jost-finite-island-model/issues"
Repository = "https://github.com/selby-botany/jost-finite-island-model"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE.md",
    "/README.md",
    "/SECURITY.md",
    "/dev",
    "/doc",
    "/src/fim",
    "/test",
    "/version.txt",
]
exclude = [
    # Local scratch/review material, gitignored via doc/.gitignore and
    # never meant to ship in a published artifact.
    "/doc/dev",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fim"]

[tool.hatch.version]
source = "regex"
path = "version.txt"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
    # PLR0917 (too many positional arguments) is PLR0913's positional-only
    # counterpart, added in a later ruff release; pytest.mark.parametrize
    # test functions intentionally take many positional arguments.
    "PLR0917",
    # mypy 1.11 requires TypeAlias for strict checking of these aliases.
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
"src/fim/engine.py" = ["N803"]
"test/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "test"]
mypy_path = "src"
warn_unreachable = true

# mpl_toolkits (unlike matplotlib's main package) ships no py.typed marker
# or stubs; this only lets mypy import it, it does not suppress any type
# error — `test/viz/test_plots.py` still narrows to the real `Axes3D` type
# via `isinstance` rather than ignoring the attribute access it enables.
[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true

# pyobjc (AppKit and friends) ships no py.typed marker or stubs, and is a
# macOS-only optional dependency `pywebview` itself pulls in only there
# (pyproject.toml's own `sys_platform != 'linux'` marker) -- `fim.gui.app.
# _set_macos_application_name`'s own deferred, try/except-guarded import
# is the only place this project imports it directly.
[[tool.mypy.overrides]]
module = "AppKit.*"
ignore_missing_imports = true

# numba is an optional extra (`jit`, above) -- unlike AppKit/mpl_toolkits,
# it does ship its own py.typed marker, but mypy still needs to *find* it
# to use it, and CI's own default `pip install -e ".[dev]"` does not
# install the `jit` extra. Every place this project imports it does so
# lazily, function-local, never at module scope (`fim.model.operators`'s
# own `jit="numba"`-gated helpers, `fim.model.vectorized`'s own
# unconditional-when-Backend-V-runs helpers -- see the `jit` extra's own
# comment above for why those two are not the same thing); without this
# override, mypy would fail with "Cannot find implementation or library
# stub for module named 'numba'" in any environment that has not
# separately installed `.[jit]`.
[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not statistical and not slow and not packaging and not gui' --strict-config --strict-markers"
testpaths = ["test"]
markers = [
    "gui: opens a real pywebview window; needs a display (xvfb-run in CI)",
    "packaging: requires a built distribution",
    "slow: long-running simulation horizon",
    "statistical: deterministic, seeded statistical validation",
]
filterwarnings = [
    # An exception on a real background thread (a `gui` test's own
    # `pywebview` JS-bridge delivery thread, most concretely) must fail
    # the run, not surface as a warning easy to miss behind buffered
    # `-q` output. Found the hard way: a window destroyed while
    # `Api.list_recent_runs()`'s result was still in flight raised a
    # `JavascriptException` on pywebview's own delivery thread that
    # only ever showed up as this warning -- see `open-run.js`'s own
    # `window.__fimOpenRunRecentRunsLoaded` comment for the real fix.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["fim"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
